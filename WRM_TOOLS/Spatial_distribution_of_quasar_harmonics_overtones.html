    let charts = {};

function executeAnalysis(name) {
        const data = MASTER_DB[name];
        if (!data) return;
        
        // 1. 座標の取得とラジアン変換
        const {ra, dec, z} = data;
        const r1 = ra * Math.PI / 180;
        const d1 = dec * Math.PI / 180;
        const r2 = DIPOLE.ra * Math.PI / 180;
        const d2 = DIPOLE.dec * Math.PI / 180;

        // 2. ダイポール軸(D)と天体方向の角距離 theta (これが干渉の基礎)
        const cosTheta = Math.sin(d1) * Math.sin(d2) + Math.cos(d1) * Math.cos(d2) * Math.cos(r1 - r2);
        const theta = Math.acos(cosTheta);

        // 3. 「外部波による補正項」の精密計算
        // Interference ∝ cos(D ・ k_local × t) のロジックを投影
        // ここではスリッピング・アングルが角距離thetaに依存し、
        // 観測される偏差（端数）が z と位相干渉によって決定される様子を再現します
        const timeArray = Array.from({length: 100}, (_, i) => i);
        
        // 上段グラフ：空間的な膨張バイアスの勾配（thetaに依存）
        charts.phase.data.datasets[0].data = timeArray.map(t => Math.cos(theta + t * 0.05));

        // 下段グラフ：WRM外部波補正（zによる増幅と、ベクトル干渉による「うなり」を再現）
        // 傾斜角が平行(theta=0)に近いほど同期し、直交(theta=π/2)で偏差が最大化する物理特性
        charts.corr.data.datasets[0].data = timeArray.map(t => {
            const interference = Math.cos(theta) * Math.cos(t * 0.1); 
            return z * (1 + 0.0461 * interference); // 0.0461は以前の対話に基づく定数
        });

        // 画面表示の更新
        document.getElementById('disp-z').innerText = z.toFixed(4);
        document.getElementById('disp-theta').innerText = theta.toFixed(5);
        document.getElementById('disp-coord').innerText = `RA ${ra.toFixed(3)}° / DEC ${dec.toFixed(3)}°`;
        
        // 天球図へのプロット更新（全天座標対応）
        const target = document.getElementById('map-target');
        target.style.display = 'block';
        target.style.left = `${(ra / 360) * 100}%`;
        target.style.top = `${(1 - (dec + 90) / 180) * 100}%`;

        Object.values(charts).forEach(c => c.update());
    }

    window.onload = () => {
        const cfg = (l, c) => ({ type: 'line', data: { labels: Array.from({length:100},(_,i)=>i), datasets: [{ label: l, borderColor: c, data: [], borderWidth: 3, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } } }});
        charts.phase = new Chart(document.getElementById('chartPhase'), cfg('Expansion Bias Gradient (Spatial)', '#3b82f6'));
        charts.corr = new Chart(document.getElementById('chartCorrection'), cfg('WRM External Wave Correction Match', '#f59e0b'));

        const input = document.getElementById('objInput');

// --- 修正されたドロップダウン制御ロジック ---

const showDrop = (filter = "") => {
    const list = keys.filter(k => k.toLowerCase().includes(filter.toLowerCase()));
    // onclick イベントに「値をセットしてリストを隠す」処理を追加
    drop.innerHTML = list.map(k => `
        <div class="combo-item" onclick="selectAndHide('${k}')">
            ${k}
        </div>
    `).join('');
    drop.style.display = list.length ? 'block' : 'none';
};

// 新しく追加したヘルパー関数
window.selectAndHide = (name) => {
    input.value = name;      // 1. テキストボックスに反映
    drop.style.display = 'none'; // 2. リストボックスを消す
    executeAnalysis(name);   // 3. そのまま解析を実行
};

// input要素の動作も最適化
input.oninput = (e) => showDrop(e.target.value);
input.onfocus = () => showDrop(input.value);
        document.getElementById('arrowBtn').onclick = (e) => { e.stopPropagation(); showDrop(""); };
        document.getElementById('analyzeBtn').onclick = () => executeAnalysis(input.value);
        document.addEventListener('click', (e) => { if(!e.target.closest('#inputArea')) drop.style.display='none'; });
