<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRM: Hubble Tension Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f1f5f9; }
        .logic-card { border-left: 4px solid #3b82f6; background: #ffffff; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-5xl mx-auto">
        
        <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 mb-8">
            <h1 id="txt-title" class="text-3xl font-bold text-slate-900 mb-2">---</h1>
            <p id="txt-subtitle" class="text-slate-600">---</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <label id="txt-label-alpha" class="block text-sm font-semibold text-slate-700 mb-4">---</label>
                    <input type="range" id="inputAlpha" min="0" max="0.1" step="0.001" value="0.046" class="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    <div class="flex justify-between mt-4">
                        <span class="text-xs text-slate-400">0.000</span>
                        <div class="text-center">
                            <span id="displayAlpha" class="text-2xl font-bold text-blue-600">0.046</span>
                            <span id="txt-recommend" class="block text-[10px] text-blue-400">---</span>
                        </div>
                        <span class="text-xs text-slate-400">0.100</span>
                    </div>
                </div>

                <div class="bg-blue-900 p-6 rounded-xl shadow-lg text-white">
                    <h3 id="txt-res-label" class="text-sm font-medium opacity-80 mb-1">---</h3>
                    <div class="text-4xl font-bold mb-2">
                        <span id="h0LocalTheo">--</span> <span class="text-lg font-normal opacity-70">km/s/Mpc</span>
                    </div>
                    <p class="text-xs opacity-70"><span id="txt-res-match">---</span>: <span id="resRate" class="font-bold">--</span>%</p>
                </div>
            </div>

            <div class="md:col-span-2 space-y-6">
                <div class="logic-card p-6 rounded-xl shadow-sm">
                    <h2 id="txt-proc-title" class="text-lg font-bold text-slate-800 mb-4">---</h2>
                    <div class="space-y-4 text-slate-600 text-sm leading-relaxed">
                        <p id="txt-step1">---</p>
                        <p id="txt-step2">---</p>
                        <div class="bg-slate-50 p-4 rounded-lg text-blue-800 text-center text-lg font-serif">
                            \( H_{0, \text{Local}} = 67.4 \times (1 + \alpha)^{1.5} \)
                        </div>
                        <p id="txt-conclusion" class="bg-blue-50 p-3 rounded border border-blue-100 text-blue-900 font-medium">
                            </p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 id="txt-verify-title" class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">---</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-slate-50 rounded-lg">
                            <span id="txt-verify-factor" class="block text-xs text-slate-500 mb-1">---</span>
                            <span id="calcEff" class="text-xl font-bold text-slate-800">--</span>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-lg">
                            <span id="txt-verify-residual" class="block text-xs text-slate-500 mb-1">---</span>
                            <span id="calcRes" class="text-xl font-bold text-red-600">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 日本語テキストをJavaScript内で一括管理（文字化け回避）
        const lang = {
            title: "ハッブル・テンション解決シミュレーター",
            subtitle: "WRM（波動屈折モデル）による観測値の物理的整合性解析",
            labelAlpha: "屈折率補正係数 α",
            recommend: "DE440 推奨値",
            resLabel: "計算結果: 近傍実効 H₀",
            resMatch: "SH0ES観測値 (73.0) との一致率",
            procTitle: "WRM 数理プロセス",
            step1: "1. 遠方宇宙の基底膨張率を H₀,Planck = 67.4 と設定。",
            step2: "2. 太陽系天体暦（DE440）の残差から導出された局所屈折率勾配 α を適用。",
            conclusionPrefix: "現在設定されている α = ",
            conclusionSuffix: " において、理論値は近傍観測データ（SH0ES）の偏差を物理的に解消します。",
            verifyTitle: "精度検証",
            verifyFactor: "実効補正係数",
            verifyResidual: "対SH0ES残差"
        };

        // 初期テキスト注入
        document.getElementById('txt-title').innerText = lang.title;
        document.getElementById('txt-subtitle').innerText = lang.subtitle;
        document.getElementById('txt-label-alpha').innerText = lang.labelAlpha;
        document.getElementById('txt-recommend').innerText = lang.recommend;
        document.getElementById('txt-res-label').innerText = lang.resLabel;
        document.getElementById('txt-res-match').innerText = lang.resMatch;
        document.getElementById('txt-proc-title').innerText = lang.procTitle;
        document.getElementById('txt-step1').innerText = lang.step1;
        document.getElementById('txt-step2').innerText = lang.step2;
        document.getElementById('txt-verify-title').innerText = lang.verifyTitle;
        document.getElementById('txt-verify-factor').innerText = lang.verifyFactor;
        document.getElementById('txt-verify-residual').innerText = lang.verifyResidual;

        const inputAlpha = document.getElementById('inputAlpha');
        const displayAlpha = document.getElementById('displayAlpha');
        const h0LocalTheo = document.getElementById('h0LocalTheo');
        const resRate = document.getElementById('resRate');
        const conclusion = document.getElementById('txt-conclusion');
        const calcEff = document.getElementById('calcEff');
        const calcRes = document.getElementById('calcRes');

        const PLANCK_H0 = 67.4;
        const SHOES_H0 = 73.0;

        function update() {
            const alpha = parseFloat(inputAlpha.value);
            
            displayAlpha.innerText = alpha.toFixed(3);
            
            // 結論段落の動的更新
            conclusion.innerText = lang.conclusionPrefix + alpha.toFixed(3) + lang.conclusionSuffix;

            const hFactor = Math.pow(1 + alpha, 1.5);
            const h0_calc = PLANCK_H0 * hFactor;
            
            h0LocalTheo.innerText = h0_calc.toFixed(2);
            calcEff.innerText = hFactor.toFixed(4);

            const gapObserved = SHOES_H0 - PLANCK_H0;
            const gapCorrected = h0_calc - PLANCK_H0;
            const resolution = (gapCorrected / gapObserved) * 100;
            resRate.innerText = Math.min(resolution, 100).toFixed(1);

            const residual = Math.abs((h0_calc - SHOES_H0) / SHOES_H0 * 100);
            calcRes.innerText = residual.toFixed(3) + "%";
        }

        inputAlpha.addEventListener('input', update);
        update();
    </script>
</body>
</html>
