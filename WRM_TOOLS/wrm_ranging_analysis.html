<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRM Ranging Analysis - 確定描画版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; }
        .glass-card { 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(59, 130, 246, 0.2); 
        }
        .chart-viewport {
            background: #000;
            border-radius: 12px;
            border: 1px solid #1e293b;
            position: relative;
            height: 300px;
            width: 100%;
            overflow: hidden;
        }
        .grid-line { stroke: rgba(255,255,255,0.05); stroke-width: 1; }
        .axis-line { stroke: rgba(255,255,255,0.3); stroke-width: 1; }
        .theory-curve { fill: none; stroke: #3b82f6; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }
        .data-point { fill: #fbbf24; filter: drop-shadow(0 0 10px #fbbf24); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-400">WRM Ranging Analysis</h1>
            <p class="text-slate-400 text-sm mt-1">波形屈折モデル（Wave Refraction Model）による距離偏差の可視化</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Controls -->
            <div class="lg:col-span-4 space-y-4">
                <div class="glass-card p-6 rounded-2xl">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-6">Parameters</h2>
                    
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between text-sm mb-2">
                                <span>赤方偏移 (z)</span>
                                <span id="valZ" class="text-blue-400 font-mono">0.50</span>
                            </div>
                            <input type="range" id="inputZ" min="0.01" max="2.0" step="0.01" value="0.5" class="w-full">
                        </div>

                        <div>
                            <div class="flex justify-between text-sm mb-2">
                                <span>ダイポール軸角 (θ)</span>
                                <span id="valTheta" class="text-blue-400 font-mono">45°</span>
                            </div>
                            <input type="range" id="inputTheta" min="0" max="180" step="1" value="45" class="w-full">
                        </div>
                    </div>
                </div>

                <div class="glass-card p-4 rounded-xl text-center">
                    <div class="text-sm text-slate-400 mb-2">基本式</div>
                    <div class="text-lg py-2">
                        $$d = d_{std}(1 + \alpha \cos \theta)$$
                    </div>
                    <div class="text-[10px] text-slate-500 mt-2">※ \(\alpha = 0.024\) (WRM基準値)</div>
                </div>
            </div>

            <!-- Visualization Area -->
            <div class="lg:col-span-8">
                <div class="glass-card p-6 rounded-2xl h-full">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-lg font-semibold">偏差プロファイル (%)</h2>
                        <div id="deviationBadge" class="px-3 py-1 bg-blue-500/20 text-blue-400 rounded-lg font-bold text-xl">
                            +0.00%
                        </div>
                    </div>

                    <!-- SVG描画エンジン (Chart.jsを使わない確実な方法) -->
                    <div class="chart-viewport" id="chartContainer">
                        <svg id="wrmSvg" width="100%" height="100%" viewBox="0 0 400 200" preserveAspectRatio="none">
                            <!-- Grid Lines -->
                            <line x1="0" y1="100" x2="400" y2="100" class="axis-line" />
                            <line x1="200" y1="0" x2="200" y2="200" class="grid-line" />
                            <line x1="0" y1="50" x2="400" y2="50" class="grid-line" />
                            <line x1="0" y1="150" x2="400" y2="150" class="grid-line" />
                            
                            <!-- Theory Curve (Path will be generated by JS) -->
                            <path id="curvePath" class="theory-curve" d="" />
                            
                            <!-- Indicator Point -->
                            <circle id="indicator" class="data-point" r="6" cx="100" cy="100" />
                        </svg>
                        <!-- Y-axis labels -->
                        <div class="absolute left-2 top-2 text-[10px] text-slate-600">+3.0%</div>
                        <div class="absolute left-2 bottom-2 text-[10px] text-slate-600">-3.0%</div>
                        <div class="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] text-slate-400">0%</div>
                    </div>

                    <div class="grid grid-cols-3 gap-4 mt-6">
                        <div class="text-center">
                            <div class="text-[10px] uppercase text-slate-500">標準距離</div>
                            <div id="dStd" class="text-lg font-mono">---</div>
                        </div>
                        <div class="text-center">
                            <div class="text-[10px] uppercase text-slate-500">WRM補正距離</div>
                            <div id="dWrm" class="text-lg font-mono text-blue-400">---</div>
                        </div>
                        <div class="text-center border-l border-slate-700">
                            <div class="text-[10px] uppercase text-slate-500">局所 H0</div>
                            <div id="h0Eff" class="text-lg font-mono text-emerald-400">---</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const alpha = 0.024;
        const svg = document.getElementById('wrmSvg');
        const curvePath = document.getElementById('curvePath');
        const indicator = document.getElementById('indicator');

        function update() {
            const z = parseFloat(document.getElementById('inputZ').value);
            const theta = parseFloat(document.getElementById('inputTheta').value);
            const thetaRad = theta * (Math.PI / 180);

            // UI Label
            document.getElementById('valZ').innerText = z.toFixed(2);
            document.getElementById('valTheta').innerText = theta + "°";

            // Calculation
            const dStdValue = z * 4285.7;
            const correction = 1 + (alpha * Math.cos(thetaRad));
            const dWrmValue = dStdValue * correction;
            const devPercent = (correction - 1) * 100;
            const h0Effective = 67.4 / correction;

            // Update Numbers
            document.getElementById('deviationBadge').innerText = (devPercent >= 0 ? '+' : '') + devPercent.toFixed(2) + '%';
            document.getElementById('dStd').innerText = dStdValue.toFixed(0) + ' Mpc';
            document.getElementById('dWrm').innerText = dWrmValue.toFixed(0) + ' Mpc';
            document.getElementById('h0Eff').innerText = h0Effective.toFixed(1);

            // Update SVG Curve
            let pathData = "M ";
            for (let x = 0; x <= 400; x++) {
                const angle = (x / 400) * 180;
                const rad = angle * (Math.PI / 180);
                const cosVal = Math.cos(rad);
                // 偏差を高さに変換 (中心100px, ±3%を±80pxにスケーリング)
                const y = 100 - (cosVal * alpha * 100 * (80/3)); 
                pathData += `${x},${y} `;
            }
            curvePath.setAttribute('d', pathData);

            // Update Indicator
            const indicatorX = (theta / 180) * 400;
            const indicatorY = 100 - (Math.cos(thetaRad) * alpha * 100 * (80/3));
            indicator.setAttribute('cx', indicatorX);
            indicator.setAttribute('cy', indicatorY);
        }

        // 初期実行とイベント紐付け
        window.addEventListener('DOMContentLoaded', () => {
            update();
            document.getElementById('inputZ').addEventListener('input', update);
            document.getElementById('inputTheta').addEventListener('input', update);
        });

        //念のための再実行
        window.onload = update;
    </script>
</body>
</html>
